name: Perpetual live Firebase audit

on:
  push:
    paths:
      - 'perpetual/firestore-rest-audit.mjs'
      - 'perpetual/recovery-audit.mjs'
      - '.github/workflows/perpetual-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-read-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Firestore and calculate standings
        run: node perpetual/firestore-rest-audit.mjs
      - name: Cross-check archives, series and current state
        run: node perpetual/recovery-audit.mjs
